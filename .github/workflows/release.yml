name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits since last tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          CHANGES=$(git log --pretty=format:"- %s" --no-merges)
        else
          CHANGES=$(git log --pretty=format:"- %s" --no-merges ${PREV_TAG}..HEAD)
        fi
        
        echo "changes<<EOF" >> $GITHUB_OUTPUT
        echo "## What's Changed" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Installation" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo '```bash' >> $GITHUB_OUTPUT
        echo "pip install sugarai==${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "Or from source:" >> $GITHUB_OUTPUT
        echo '```bash' >> $GITHUB_OUTPUT
        echo "git clone https://github.com/roboticforce/sugar.git" >> $GITHUB_OUTPUT
        echo "cd sugar" >> $GITHUB_OUTPUT
        echo "git checkout ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        echo "pip install -e ." >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Docker" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo '```bash' >> $GITHUB_OUTPUT
        echo "docker pull ghcr.io/roboticforce/sugar:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body: ${{ steps.changelog.outputs.changes }}
        draft: false
        prerelease: ${{ contains(github.ref, '-') || contains(github.ref, '.dev') || contains(github.ref, '.rc') }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: create-release
    environment: release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: create-release
    # Packaging failure must never fail a release that already published.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Build universal DMG (ad-hoc signed)
      run: |
        chmod +x apps/macos/build-app.sh apps/macos/build-dmg.sh
        cd apps/macos
        ./build-dmg.sh --universal

    - name: Attach DMG to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" apps/macos/dist/*.dmg --clobber
